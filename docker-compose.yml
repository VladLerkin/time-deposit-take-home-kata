services:
  postgres:
    image: postgres:16-alpine
    container_name: time-deposit-postgres
    environment:
      POSTGRES_DB: timedeposit
      POSTGRES_USER: timedeposit
      POSTGRES_PASSWORD: timedeposit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedeposit -d timedeposit"]
      interval: 5s
      timeout: 5s
      retries: 5
